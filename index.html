<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171b25">
  <title>나 혼자만 전설의 용사</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="eyebrow">ELDORIA · LIFE RPG</div>
      <h1>나 혼자만 전설의 용사</h1>
      <p>평범한 15세에서 전설의 주인공까지, 나만의 인생을 만들어라.</p>
    </header>

    <section id="setup" class="panel">
      <h2>새로운 인생 시작</h2>
      <p class="muted">직업을 선택하고 능력치를 새로고침해 마음에 드는 인생을 시작하세요.</p>
      <label for="jobSelect">시작 직업</label>
      <select id="jobSelect"></select>
      <div id="startStats" class="stats-grid"></div>
      <div class="button-row">
        <button id="rerollBtn" class="secondary">능력치 새로고침</button>
        <button id="startBtn" class="primary">이 인생 시작하기</button>
      </div>
      <p class="hint">능력치 새로고침은 선택한 직업을 유지하며 능력치만 다시 정합니다.</p>
    </section>

    <section id="game" class="hidden">
      <div class="topbar">
        <div><span id="ageLabel">15세</span><span class="dot">·</span><span id="careerLabel">초급 모험가</span></div>
        <div class="resources"><span>금화 <b id="goldLabel">0</b></span><span>명성 <b id="fameLabel">0</b></span></div>
      </div>
      <nav class="tabs">
        <button class="tab active" data-tab="event">이벤트</button>
        <button class="tab" data-tab="status">능력치</button>
      </nav>

      <section id="eventView" class="panel view">
        <div class="event-kicker" id="phaseLabel">인생의 시작</div>
        <h2 id="eventTitle">새로운 인생</h2>
        <p id="eventText" class="event-text"></p>
        <div id="choices" class="choices"></div>
        <div id="resultBox" class="result hidden" aria-live="polite">
          <h3 id="resultTitle">결과</h3>
          <p id="resultText"></p>
          <div id="resultChanges" class="changes"></div>
          <button id="continueBtn" class="primary full">계속하기</button>
        </div>
      </section>

      <section id="statusView" class="panel view hidden">
        <div class="event-kicker">CHARACTER STATUS</div>
        <h2>내 능력치</h2>
        <div id="gameStats" class="stats-grid"></div>
        <div class="extra-stats">
          <div><span>나이</span><b id="statusAge">15세</b></div>
          <div><span>직업</span><b id="statusJob">-</b></div>
          <div><span>금화</span><b id="statusGold">0</b></div>
          <div><span>명성</span><b id="statusFame">0</b></div>
        </div>
        <p class="hint">이벤트 화면으로 돌아가도 진행 상황은 유지됩니다.</p>
      </section>
    </section>

    <footer>ELDORIA · 당신의 선택이 전설을 만든다</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
